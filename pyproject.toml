[project]
name = "react-memory"
version = "0.1.0"
description = "A block-based, reactive memory model for LLM context management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
